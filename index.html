function reviewRubric(s){return RICH[s.id].finalDimension?RICH[s.id].strong:rubric}
function richCase(s=session){return CASES.find(c=>c.id===s.id)}
function pathFor(s=session){return RICH[s.id].branches.find(b=>b.id===s.branch)}
function richCalc(s=session,step=s.step){const c=richCase(s),b=pathFor(s);return step===2?c.calc:step===4?b?.calc:step===5?b?.stressCalc:null}
function numericKey(step){return step===2?'number':step===4?'deepNumber':'stressNumber'}
function matches(v,cal){if(cal?.openEstimate)return null;return !!cal&&String(v??'').trim()!==''&&Number.isFinite(Number(v))&&Math.abs(Number(v)-cal.answer)<=cal.tolerance}
function eventLog(type,detail){session.events=session.events||[];session.events.push({type,detail,at:Date.now()});persist()}
start=function(id){if(session&&!confirm('Replace your unfinished session? Completed sessions will be kept.'))return;session={id,version:3,step:0,started:Date.now(),opened:[],answers:{},hint:false,hints:[],probes:[],clarified:[],events:[]};persist();renderSession()};

'What is the client trying to achieve? What would you clarify, and how would you structure your investigation?',

][s.step]}
function requestCards(c){return `<div class="exhibits">${c.exhibits.map(e=>`<div class="exhibit"><div class="eyebrow">${esc(e.category)}</div><h3>${esc(e.title)}</h3>${session.opened.includes(e.id)?`<p>${esc(e.text)}</p><span class="note">Request #${session.opened.indexOf(e.id)+1}</span>`:`<button data-open="${e.id}">Request information +</button>`}</div>`).join('')}</div>`}
function reviewFacts(){const c=richCase(),r=RICH[c.id],b=pathFor();stopMedia();modal(`<h2>What you know so far</h2><p>${esc(c.brief)}</p>${(session.clarified||[]).map(i=>`<h3>${esc(r.clarifications[i][0])}</h3><p>${esc(r.clarifications[i][1])}</p>`).join('')}${c.exhibits.filter(e=>session.opened.includes(e.id)).map(e=>`<h3>${esc(e.title)}</h3><p>${esc(e.text)}</p>`).join('')}${b&&session.step>=4?`<h3>${esc(b.title)}</h3><p>${esc(b.evidence)}</p>`:''}${b&&session.step>=5?`<h3>Latest update</h3><p>${esc(b.shock)}</p>`:''}`)}
renderSession=function(){if(!session||session.version!==3)return oldRender();stopMedia();view='session';const c=richCase(),r=RICH[c.id],step=session.step,b=pathFor(),q=richQuestion(session),cal=richCalc();let content='';
if(step===0)content=`<p class="brief">${esc(c.brief)}</p><h3>Clarify with the interviewer</h3><p class="note">Choose a clarification to reveal the response. These requests are not scored.</p>${r.clarifications.map((x,i)=>`<div class="clarify"><button data-clarify="${i}">${esc(x[0])}</button>${session.clarified?.includes(i)?`<p>${esc(x[1])}</p>`:''}</div>`).join('')}`;
if(step===1)content=`<p class="note">Request the information you need and explain your reasoning below. You may return for more evidence later. Opening every exhibit does not earn a higher score.</p>${requestCards(c)}`;
if(step===3)content=`<div class="exhibits">${r.branches.map(p=>`<div class="exhibit ${session.branch===p.id?'chosen':''}"><h3>${esc(p.title)}</h3><p>${esc(p.focus)}</p><button data-path="${p.id}" aria-pressed="${session.branch===p.id}">${session.branch===p.id?'Selected path':'Explore this path'}</button></div>`).join('')}</div><p class="note">This choice determines the next data and questions, not whether your answer is correct. You can explore the other path in another attempt.</p>`;
if(step===4)content=`<h3>${esc(b.title)}</h3><p class="brief">${esc(b.evidence)}</p>`;
if(step===5)content=`<div class="eyebrow">INTERVIEWER UPDATE</div><p class="brief">${esc(b.shock)}</p><p class="note">This replaces only the assumptions explicitly identified in the update. State which parts of your original conclusion remain valid.</p>`;
if(cal)content+=`${step===2?'':`<p><b>${esc(cal.question)}</b></p>`}<label for="number">Numerical result (${esc(cal.unit)})</label><input id="number" type="number" step="any" value="${esc(session.answers[numericKey(step)]??'')}" placeholder="Enter your result"><div class="actions"><button id="hint">Show calculation hint</button></div>${session.hints?.includes(step)?`<p class="hint">${esc(cal.hint)}</p>`:''}`;
if(step===6)content=`<p class="note">Use the latest evidence from your chosen path. A partial solution, a pilot, a deferral or a rejection can be defensible if supported by the facts.</p>`;
if(step===7)content=`<p class="note">Separate what you would do immediately from what depends on a test. Identify leading indicators as well as the final outcome.</p>`;
if(step>=6&&r.finalDimension)content=`<p class="note">${esc(r.archetype==='diagnosis'?'Keep the problem statement separate from possible interventions. State what is established and what remains uncertain.':'Explain the estimate, its range and the assumptions you would validate. The hypothetical cross-check is not a measured market total.')}</p>`;
const probe=step>=4&&b?b.probe:['Which assumption could most change your approach?','What would make you abandon your leading hypothesis?','What unit or scale error would make this result misleading?','Why is this the most useful next question?'][step];
$('#app').innerHTML=`<div class="row"><div><div class="eyebrow">${esc(c.company)}</div><h2 class="section-title">${esc(c.title)}</h2></div><span class="badge">${step+1}/8 · ${stageLabels()[step]}</span></div><div class="workspace"><aside class="sidebar"><div class="eyebrow">YOUR INVESTIGATION</div>${stageLabels().map((x,i)=>`<span class="step ${i===step?'active':''}">${i+1} &nbsp;${x}</span>`).join('')}<p class="note timer" id="timer">${clock(elapsed(session))} elapsed</p><p class="note">${b?'Path: '+esc(b.title):'Two investigative paths available.'}</p><button id="saveExit">Save & exit</button></aside><section class="panel"><div class="eyebrow">INTERVIEWER · AUTHORED CASE</div><div class="interviewer"><p>${esc(q)}</p></div>${voiceControls()}${content}<div class="actions"><button id="review">Review known facts</button>${step>1?'<button id="moreEvidence">Request more evidence</button>':''}</div><br>${textEntry(richKeys[step])}<details id="probe"><summary>Practise a follow-up</summary><p>${esc(probe)}</p><button id="readProbe">Read follow-up aloud</button><p class="note">Prepared prompt; add your response above.</p></details><div class="actions"><button id="back">${step?'← Back':'Save & exit'}</button><button id="next" class="primary next">${step===7?'Finish & review':'Submit & continue →'}</button></div></section></div>`;
bindSpeech((step===0?c.brief+' ':step===4?b.evidence+' ':step===5?b.shock+' ':'')+q+(cal&&step!==2?' '+cal.question:''));setupVoice();$('#answer').oninput=e=>{session.answers[richKeys[step]]=e.target.value;persist()};$('#back').onclick=()=>{if(step){session.step--;persist();renderSession()}else home()};$('#next').onclick=advance;$('#saveExit').onclick=home;$('#review').onclick=reviewFacts;
if($('#number'))$('#number').oninput=e=>{session.answers[numericKey(step)]=e.target.value;persist()};if($('#hint'))$('#hint').onclick=()=>{session.hints=session.hints||[];if(!session.hints.includes(step)){session.hints.push(step);eventLog('hint',String(step))}if(step===2)session.hint=true;persist();renderSession()};
document.querySelectorAll('[data-clarify]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.clarify);session.clarified=session.clarified||[];if(!session.clarified.includes(i)){session.clarified.push(i);eventLog('clarification',r.clarifications[i][0])}renderSession()});
function bindRequests(){document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{if(!session.opened.includes(el.dataset.open)){session.opened.push(el.dataset.open);eventLog('exhibit',el.dataset.open)}if($('#modal').open){$('#modal').close();renderSession();$('#moreEvidence').click()}else renderSession()})}bindRequests();
if($('#moreEvidence'))$('#moreEvidence').onclick=()=>{stopMedia();modal('<h2>Request more evidence</h2>'+requestCards(c));bindRequests()};
document.querySelectorAll('[data-path]').forEach(el=>el.onclick=()=>{if(session.branch===el.dataset.path)return;if(session.branch&&(session.answers.deepReason||session.answers.stressReason||session.answers.recommendation)&&!confirm('Changing paths clears later path answers and recommendations so they match the new evidence. Earlier analysis is kept. Continue?'))return;session.branch=el.dataset.path;session.aiTurns=(session.aiTurns||[]).filter(t=>t.stage<4);session.infoRequests=(session.infoRequests||[]).filter(t=>t.stage<4);session.infoDraft='';for(const k of ['deepReason','stressReason','deepNumber','stressNumber','recommendation','implementation'])delete session.answers[k];session.hints=(session.hints||[]).filter(x=>x===2);eventLog('path',session.branch);renderSession()});
$('#readProbe').onclick=()=>speak(probe);$('#probe').ontoggle=e=>{if(e.target.open&&session&&!session.probes.includes(step)){session.probes.push(step);eventLog('probe',String(step))}};
};
advance=function(){if(session?.version!==3)return oldAdvance();stopMedia();const step=session.step,a=session.answers,cal=richCalc();if(!String(a[richKeys[step]]||'').trim())return toast('Explain your reasoning before continuing.');if(step===1&&session.id!=='guesstimate'&&!session.opened.length)return toast('Request at least one exhibit to support your hypothesis.');if(step===3&&!pathFor())return toast('Choose an investigative path.');if(cal?.openEstimate&&Number(a[numericKey(step)])<0)return toast('Enter a non-negative estimate.');if(cal&&(String(a[numericKey(step)]??'').trim()===''||!Number.isFinite(Number(a[numericKey(step)]))))return toast('Enter a valid numerical result.');eventLog('submitted',stageLabels()[step]);if(step<7){session.step++;persist();renderSession()}else{session.finished=Date.now();session.uid=String(Date.now());history.unshift(JSON.parse(JSON.stringify(session)));history=history.slice(0,50);save('cr-history',history);report=history[0];session=null;persist();showReport(report)}window.scrollTo(0,0)};
transcript=function(s){if(s.version!==3)return oldTranscript(s);return richKeys.map((k,i)=>`${i+1}. ${stageLabels(s)[i].toUpperCase()}\n${s.answers[k]||'No response'}${[2,4,5].includes(i)?'\nNumeric result: '+(s.answers[numericKey(i)]??'')+' '+richCalc(s,i)?.unit:''}`).join('\n\n')};
aiPacket=function(s){const base=oldPacket(s);if(s.version!==3)return base;const r=RICH[s.id],b=pathFor(s);return base+`\n\nEXTENDED CASE CONTEXT — THIS OVERRIDES THE SHORT ORIGINAL RECOMMENDATION WHEN ASSUMPTIONS CHANGED\nSelected branch: ${b.title}\nDeep-dive data: ${b.evidence}\nDeep-dive question: ${b.calc.question}\nCheck: ${b.calc.working}\nNew evidence: ${b.shock}\nUpdated question: ${b.stressCalc.question}\nCheck: ${b.stressCalc.working}\nDefensible revised synthesis: ${b.model}\n\nCase-specific review criteria:\n${r.strong.join('\n')}\nCommon traps (do not assume candidate made them):\n${r.pitfalls.join('\n')}\n\nHints used at stages: ${(s.hints||[]).map(i=>stageLabels(s)[i]).join(', ')||'None'}\nClarifications requested: ${(s.clarified||[]).map(i=>r.clarifications[i].join(': ')).join('\n')||'None'}\n\nEvaluate how the candidate updated their analysis and final synthesis, not just their initial answer. ${r.assessmentInstruction||''} Do not penalise the unchosen path. All economic and impact figures are fictional educational assumptions, not external benchmarks.`};
reportText=function(s){const base=oldReportText(s);if(s.version!==3)return base;const b=pathFor(s),r=RICH[s.id];return base+`\n\nEXTENDED PATH: ${b.title}\n${b.evidence}\n\nDEEP-DIVE CHECK\n${b.calc.working}\n\nNEW EVIDENCE\n${b.shock}\n\nUPDATED CHECK\n${b.stressCalc.working}\n\nREVISED REFERENCE\n${b.model}\n\nCASE-SPECIFIC REVIEW\n${r.strong.join('\n')}\n\nCOMMON TRAPS\n${r.pitfalls.join('\n')}`};
showReport=function(s){oldReport(s);if(s.version!==3)return;const c=richCase(s),r=RICH[s.id],b=pathFor(s);const section=document.createElement('section');section.className='panel extended-report';section.innerHTML=`<div class="eyebrow">YOUR DEEPER INVESTIGATION</div><h2>${esc(b.title)}</h2><p class="note">The short reference later in this report describes the initial case. Use the revised reference in this section for your final synthesis.</p><h3>Three numerical checkpoints</h3>${[2,4,5].map(i=>{const cal=richCalc(s,i),v=s.answers[numericKey(i)];return `<div class="feedback"><strong class="${matches(v,cal)?'good':'improve'}">${cal.openEstimate?'Assumption-led estimate · not automatically graded':matches(v,cal)?'✓ Matched':'↗ Review'} · ${stageLabels(s)[i]}</strong><p>${esc(cal.question)}</p><p>Your result: ${esc(v)} ${esc(cal.unit)}</p><p>${esc(cal.working)}</p></div>`}).join('')}<h3>How the facts changed</h3><p class="brief">${esc(b.shock)}</p><h3>A defensible revised synthesis</h3><p>${esc(b.model)}</p><h3>Review these features in your own answers</h3><ul>${r.strong.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Common traps to check</h3><ul>${r.pitfalls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="note">These are case-specific coaching prompts, not claims that you demonstrated or missed a skill. Use your transcript or optional AI review to assess that.</p><details><summary>Explore the other route after finishing</summary>${r.branches.filter(x=>x.id!==b.id).map(x=>`<h3>${esc(x.title)}</h3><p>${esc(x.evidence)}</p><p>${esc(x.calc.question)}</p><p>${esc(x.calc.working)}</p><h4>Later update</h4><p>${esc(x.shock)}</p><p>${esc(x.stressCalc.working)}</p><p>${esc(x.model)}</p>`).join('')}</details><details><summary>Your investigation trail</summary><ol>${(s.events||[]).map(e=>`<li>${esc(e.type)}: ${esc(e.detail)}</li>`).join('')}</ol></details><div class="actions"><button id="retryPath" class="primary">Try another path</button><button id="exportExtended">Download complete feedback</button></div>`;
// Place extended analysis before the original report panel so new evidence is not buried.
const panel=$('#app .panel');panel.before(section);$('#retryPath').onclick=()=>start(s.id);$('#exportExtended').onclick=()=>download(reportText(s),`case-room-${s.id}-feedback.txt`);
const metrics=document.querySelectorAll('.score-grid .metric');if(metrics[0])metrics[0].textContent=[2,4,5].filter(i=>matches(s.answers[numericKey(i)],richCalc(s,i))).length+'/'+[2,4,5].filter(i=>!richCalc(s,i).openEstimate).length;const metricLabels=document.querySelectorAll('.score-grid .note');if(metricLabels[0])metricLabels[0].textContent='Arithmetic checks matched';if(metrics[2])metrics[2].textContent=String(s.hints?.length||0);
};
function sources(){stopMedia();modal(`<h2>Research behind the practice</h2><p>Reviewed 16 November 2026. The nine scenarios, numbers, branches and rubrics are original fictional teaching material. They are not copied interview cases or industry benchmarks.</p><ul><li><a target="_blank" rel="noopener noreferrer" href="https://www.mckinsey.com/careers/interviewing">McKinsey: Interview preparation</a> — tailored problem solving and more than one defensible approach.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.mckinsey.com/careers/interviewing/talbot-trucks">McKinsey: Talbot Trucks</a> — investment attractiveness, information gathering and numerical reasoning. Our investment scenario is original; these exercises do not predict which archetype a firm will use.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.bain.com/careers/hiring-process/case-interview/">Bain: Case interview preparation</a> — clarify, structure, explain and adapt.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.bain.com/careers/hiring-process/interviewing/fashion-case-study/">Bain: FashionCo</a> — options, trade-offs, risks and next steps.</li></ul><h3>Design choices made for Case Room</h3><p>Two named investigation paths give different evidence and calculations. A later update challenges initial assumptions. Answers stay open-ended; only arithmetic is automatically checked. The authored branching is not live AI or a replica of any firm’s assessment.</p><h3>Can Groq power AI feedback?</h3><p>Yes. The hosted app supports Groq, OpenAI, Gemini, Claude, DeepSeek, OpenRouter and an administrator-configured compatible endpoint. Connect your own key in AI settings. Browser speech remains independent. Keys are kept in tab memory; requests are relayed through the site server.</p><p><a target="_blank" rel="noopener noreferrer" href="https://console.groq.com/docs/quickstart">Groq setup</a> · <a target="_blank" rel="noopener noreferrer" href="https://console.groq.com/docs/production-readiness/security-onboarding">Key security</a> · <a target="_blank" rel="noopener noreferrer" href="https://console.groq.com/docs/rate-limits">Usage limits</a></p>`)}
home=function(){oldHome();const intro=$('#app .note');if(intro)intro.textContent='9 original cases · 8 stages · 2 paths per case · Speak or type';const button=document.createElement('button');button.id='research';button.textContent='Research & case design';button.onclick=sources;$('#library .row').append(button);const note=document.createElement('p');note.className='note';note.textContent='New sessions use the extended format. Previously saved sessions retain their original four-stage flow.';$('#library').prepend(note)};
const originalPrivacy=$('#privacy').onclick;$('#privacy').onclick=()=>{originalPrivacy();$('#modalContent').insertAdjacentHTML('beforeend','<p>Expanded edition: nine original cases, eight stages and two investigative branches per case. Numerical checks are educational arithmetic checks, not an interview-readiness score.</p><button id="sources">Research & sources</button>');$('#sources').onclick=()=>{$('#modal').close();sources()}};

window.addEventListener('pagehide',stopMedia);setInterval(()=>{if(view==='session'&&session&&$('#timer'))$('#timer').textContent=clock(elapsed(session))+' elapsed'},1000);home();
</script><script src="ai-client.js"></script></body></html>
